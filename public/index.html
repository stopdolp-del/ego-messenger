<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ego Messenger</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="dark-theme">

  <div id="authContainer" class="auth-box">
    <h2>ego Messenger</h2>
    <div id="authTabs">
      <button onclick="switchAuthTab('login')" id="loginTabBtn" class="active">Вход</button>
      <button onclick="switchAuthTab('register')" id="regTabBtn">Регистрация</button>
    </div>
    
    <form id="authForm" onsubmit="handleAuth(event)">
      <input type="text" id="authUsername" placeholder="Имя пользователя" required>
      <input type="email" id="authEmail" placeholder="Email (только для регистрации)" style="display:none;">
      <input type="password" id="authPassword" placeholder="Пароль" required>
      <button type="submit" id="authSubmitBtn">Войти</button>
    </form>
  </div>

  <div id="appContainer" style="display: none;">
    <aside class="sidebar">
      <div class="user-profile-bar">
        <img id="myAvatar" src="/uploads/avatars/default.png" alt="Avatar" onclick="openProfileModal()">
        <span id="myUsername">...</span>
      </div>
      
      <div class="search-bar">
        <input type="text" id="userSearchInput" placeholder="Поиск пользователей..." oninput="searchUsers(this.value)">
      </div>
      <div id="searchResults" class="search-results-list"></div>

      <h3>Контакты</h3>
      <div id="contactsList" class="contacts-list"></div>
    </aside>

    <main class="chat-area">
      <header class="chat-header" id="chatHeader" style="display: none;">
        <div class="chat-user-info">
          <img id="chatUserAvatar" src="" alt="">
          <div>
            <h4 id="chatUserName">Выберите чат</h4>
            <span id="chatUserStatus" class="status-offline">offline</span>
          </div>
        </div>
        <div class="call-buttons">
          <button onclick="startCall(false)" title="Аудиозвонок">📞</button>
          <button onclick="startCall(true)" title="Видеозвонок">📹</button>
        </div>
      </header>

      <div id="messagesContainer" class="messages-container"></div>

      <footer class="chat-footer" id="chatFooter" style="display: none;">
        <input type="text" id="messageInput" placeholder="Напишите сообщение..." onkeydown="handleKeyPress(event)" oninput="sendTyping()">
        
        <button id="voiceBtn" class="media-btn" title="Голосовое">🎤</button>
        <button id="videoNoteBtn" class="media-btn" title="Кружочек">📷</button>
        <button onclick="sendMessage()" class="send-btn">Отправить</button>
      </footer>
    </main>
  </div>

  <div id="incomingCallModal" class="modal" style="display:none;">
    <div class="modal-content">
      <img id="callerAvatar" src="" class="call-avatar">
      <h3 id="callerName">Входящий вызов...</h3>
      <div class="call-actions">
        <button onclick="acceptCall()" class="btn-accept">Ответить</button>
        <button onclick="rejectCall()" class="btn-reject">Отклонить</button>
      </div>
    </div>
  </div>

  <div id="activeCallScreen" class="call-screen" style="display:none;">
    <div class="video-grid">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="call-controls">
      <button onclick="endCall()" class="btn-end-call">Завершить звонок</button>
    </div>
  </div>

  <div id="videoNoteModal" class="modal" style="display:none;">
    <div class="modal-content circle-preview">
      <video id="videoNotePreview" autoplay muted playsinline class="circle-video"></video>
      <button id="stopVideoNoteBtn" class="btn-record-stop">Остановить и отправить</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
