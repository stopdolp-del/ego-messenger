<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ego Messenger</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="authContainer" class="auth-box">
    <h2>ego Messenger</h2>
    <div id="authTabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">Вход</button>
      <button id="tabRegister" onclick="switchTab('register')">Регистрация</button>
    </div>

    <form id="authForm" onsubmit="handleAuth(event)">
      <input type="text" id="usernameInput" placeholder="Имя пользователя" required />
      <input type="password" id="passwordInput" placeholder="Пароль" required />
      <button type="submit" id="authSubmitBtn">Войти</button>
    </form>
  </div>

  <div id="appContainer" style="display: none;">
    
    <aside class="sidebar">
      <div class="user-profile-bar">
        <img id="myAvatar" src="https://via.placeholder.com/40" alt="Avatar">
        <span id="myUsername" style="font-weight: bold;">User</span>
      </div>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Поиск пользователей..." oninput="searchUsers()">
      </div>

      <div class="contacts-list" id="contactsList">
        </div>
    </aside>

    <main class="chat-area">
      <header class="chat-header">
        <div class="chat-user-info">
          <img id="chatAvatar" src="https://via.placeholder.com/40" alt="Avatar" style="display:none;">
          <h3 id="chatTitle">Выберите чат для начала общения</h3>
        </div>
        <div class="call-buttons" id="callButtons" style="display: none;">
          <button onclick="startCall('audio')" title="Голосовой звонок">📞</button>
          <button onclick="startCall('video')" title="Видеозвонок">📹</button>
        </div>
      </header>

      <div class="messages-container" id="messagesContainer">
        </div>

      <footer class="chat-footer" id="chatFooter" style="display: none;">
        <button class="media-btn" onclick="triggerFileInput()" title="Прикрепить файл">📎</button>
        <input type="file" id="fileInput" style="display: none;" onchange="sendFile(event)">
        
        <input type="text" id="messageInput" placeholder="Напишите сообщение..." onkeydown="if(event.key === 'Enter') sendMessage()">
        
        <button class="media-btn" id="voiceBtn" onclick="toggleVoiceRecord()" title="Голосовое сообщение">🎙️</button>
        <button class="send-btn" onclick="sendMessage()">Отправить</button>
      </footer>
    </main>

  </div>

  <div id="callScreen" class="call-screen" style="display: none;">
    <div class="video-grid">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="call-controls">
      <button class="btn-end-call" onclick="endCall()">Завершить звонок</button>
    </div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
