<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ego — Веб-мессенджер</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="/socket.io/socket.io.js"></script>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- AUTH SCREEN -->
<div id="auth">
  <div class="auth-shell">
    <div class="auth-brand">
      <div class="auth-logo">e</div>
      <h1>ego</h1>
      <p id="auth-tag">Войдите чтобы продолжить</p>
    </div>
    <div class="auth-card">
      <div class="error-msg" id="auth-err"></div>
      <div class="fg">
        <label>Имя пользователя</label>
        <input type="text" id="a-user" placeholder="username" autocomplete="off" onkeydown="if(event.key==='Enter')doAuth()">
      </div>
      <div class="fg" id="a-email-g" style="display:none">
        <label>Email</label>
        <input type="email" id="a-email" placeholder="you@mail.com">
      </div>
      <div class="fg">
        <label>Пароль</label>
        <input type="password" id="a-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAuth()">
      </div>
      <button class="btn btn-primary" id="a-btn" onclick="doAuth()" style="margin-top:6px">Войти</button>
      <div class="auth-switch" onclick="toggleReg()" id="a-switch">Нет аккаунта? <b>Зарегистрироваться</b></div>
    </div>
  </div>
</div>

<!-- APP SCREEN -->
<div id="app">
  <div class="app-container">

    <!-- RAIL -->
    <div class="rail">
      <div class="rail-logo" onclick="goToDMs()" title="ego">e</div>
      <div class="rail-div"></div>
      <div class="ri act" id="rail-dm" onclick="goToDMs()" title="Личные сообщения">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      </div>
      <div class="rail-div"></div>
      <div id="rail-servers" style="display:contents"></div>
      <div class="ri dashed" onclick="openModal('m-server')" title="Создать сервер">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sb-head" id="sb-title">
        <span>Сообщения</span>
      </div>

      <!-- DM VIEW -->
      <div id="dm-view">
        <div class="sb-search">
          <div class="sb-search-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input id="srch-inp" placeholder="Поиск пользователей..." oninput="doSearch(this.value)">
          </div>
        </div>
        <div id="srch-res"></div>
        <div class="sb-sec"><span>Контакты</span></div>
        <div id="contacts-list" class="sb-scroll"></div>
      </div>

      <!-- CHANNEL VIEW -->
      <div id="ch-view" style="display:none">
        <div class="sb-sec"><span>Каналы</span></div>
        <div id="channels-list" class="sb-scroll"></div>
      </div>

      <!-- USER CARD -->
      <div class="user-card">
        <div class="ava online" id="uc-ava" onclick="openProfileModal()" style="cursor:pointer">U</div>
        <div class="uc-info" onclick="openProfileModal()">
          <div class="uc-name"><span id="uc-name">User</span><span id="uc-vbadge"></span></div>
          <div class="uc-sub" id="uc-sub">🟢 В сети</div>
        </div>
        <button class="tib" onclick="logout()" title="Выйти">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </div>

    <!-- CHAT MAIN -->
    <div class="chat" id="chat">
      <!-- Head -->
      <div class="chat-head">
        <div class="ch-left">
          <button class="tib" onclick="showSidebar()" style="display:none" id="mob-back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <div class="ava" id="ch-ava" style="display:none">?</div>
          <div>
            <div class="ch-title">
              <span id="ch-sym" style="color:var(--neon-cyan)">@</span>
              <span id="ch-name">ego Мессенджер</span>
              <span id="ch-vbadge"></span>
            </div>
            <div class="ch-sub" id="ch-sub">Выберите чат</div>
          </div>
        </div>
        <div class="ch-right">
          <button class="tib" id="btn-audio" onclick="startCall(false)" style="display:none" title="Аудиозвонок">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.62 3.38a2 2 0 0 1 1.99-2.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          </button>
          <button class="tib" id="btn-video" onclick="startCall(true)" style="display:none" title="Видеозвонок">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
          </button>
          <button class="tib" id="btn-invite" onclick="openInviteModal()" style="display:none" title="Пригласить">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
          </button>
        </div>
      </div>

      <!-- Messages Viewport -->
      <div class="msgs" id="msgs">
        <div class="chat-welcome" id="chat-welcome">
          <div class="cw-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          </div>
          <div class="cw">
            <h2>ego Messenger</h2>
            <p>Выберите контакт или канал слева для начала общения.</p>
          </div>
        </div>
      </div>

      <!-- Input Bar -->
      <div class="input-bar">
        <div class="ib-left">
          <button class="tib" id="btn-attach" title="Прикрепить фото" onclick="document.getElementById('file-attach').click()" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
          </button>
          <input type="file" id="file-attach" accept="image/*" style="display:none" onchange="sendImageAttachment(event)">
          <button class="tib" id="btn-voice" title="Голосовое сообщение" onclick="openVoiceModal()" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          </button>
          <button class="tib" id="btn-vnote" title="Видеокружочек" onclick="openVnoteModal()" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3" fill="currentColor"></circle></svg>
          </button>
        </div>
        <div class="ib-field">
          <textarea class="ib-textarea" id="msg-input" rows="1" placeholder="Написать сообщение..." disabled onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
        </div>
        <button class="send-btn" id="send-btn" onclick="sendMsg()" disabled title="Отправить">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>

  </div>
</div>

<!-- MODALS -->

<!-- Profile Modal -->
<div class="mo" id="m-profile">
  <div class="mb">
    <div class="mh"><h3>Профиль</h3><button class="mclose" onclick="closeModal('m-profile')">✕</button></div>
    <div class="fg"><label>Имя пользователя</label><input type="text" id="p-username" disabled></div>
    <div class="fg"><label>Эмодзи статус</label><input type="text" id="p-emoji" placeholder="🟢"></div>
    <div class="fg"><label>Текстовый статус</label><input type="text" id="p-status" placeholder="В сети / Кодирую..."></div>
    <div class="fg"><label>О себе (Bio)</label><input type="text" id="p-bio" placeholder="Пара слов о себе..."></div>
    <div class="mf" style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
      <button class="btn btn-secondary" onclick="closeModal('m-profile')" style="width:auto;padding:10px 20px;">Отмена</button>
      <button class="btn btn-primary" onclick="saveProfile()" style="width:auto;padding:10px 20px;">Сохранить</button>
    </div>
  </div>
</div>

<!-- Video Note Recorder Modal -->
<div class="mo" id="m-vnote">
  <div class="mb" style="max-width:320px;text-align:center;">
    <div class="mh"><h3>Видеокружочек</h3><button
